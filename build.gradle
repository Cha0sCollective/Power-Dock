plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.89'
}

group = 'org.cha0scollective.powerdock'
version = '0.4.0-beta3'
base { archivesName = 'power-dock' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
def minimumSableVersion = '2.0.5'
def sableVersion = providers.gradleProperty('sableVersion').orElse('2.0.6').get()
def computerCraftVersion = '1.120.2'
def withComputerCraft = providers.gradleProperty('withComputerCraft').map { it.toBoolean() }.getOrElse(false)
def loconauticsTestMods = providers.gradleProperty('loconauticsTestMods').getOrNull()
def lifecyclePhase = providers.gradleProperty('dockLifecyclePhase').getOrNull()
def lifecycleRun = providers.gradleProperty('dockLifecycleRun').getOrNull()
if (lifecyclePhase != null && (!(lifecyclePhase in ['save-clean', 'save-abrupt', 'restore']) ||
        lifecycleRun == null || !(lifecycleRun ==~ /[a-z0-9_-]+/))) {
    throw new GradleException('Run the dock restart fixture through tools/test_dock_restart.py.')
}
def dockingTestRun = layout.buildDirectory.dir(lifecyclePhase != null ? "dock-restart/${lifecycleRun}" :
        "power-dock-test-${sableVersion}${loconauticsTestMods != null ? '-loconautics' : ''}${withComputerCraft ? '-cc' : ''}")
def dockingTestLane = lifecyclePhase != null ? 'lifecycle' :
        loconauticsTestMods != null ? (withComputerCraft ? 'loconautics-cc' : 'loconautics') :
        withComputerCraft ? 'computercraft' : 'base'

sourceSets {
    gameTest {
        java.destinationDirectory.set(layout.buildDirectory.dir("classes/java/gameTest-${dockingTestLane}"))
        output.resourcesDir = layout.buildDirectory.dir("resources/gameTest-${dockingTestLane}").get().asFile
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath
        if (withComputerCraft) {
            java.srcDir 'src/ccGameTest/java'
            resources.srcDir 'src/ccGameTest/resources'
        }
        if (lifecyclePhase != null) {
            java.srcDir 'src/lifecycleGameTest/java'
            resources.srcDir 'src/lifecycleGameTest/resources'
        }
        if (loconauticsTestMods != null) {
            java.srcDir 'src/loconauticsGameTest/java'
            resources.srcDir 'src/loconauticsGameTest/resources'
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://mvn.devos.one/snapshots' }
    maven { url = 'https://maven.architectury.dev' }
    maven {
        url = 'https://maven.squiddev.cc'
        content { includeGroup 'cc.tweaked' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://maven.ryanhcode.dev/releases' } }
        filter { includeGroup 'dev.ryanhcode.sable'; includeGroup 'dev.ryanhcode.sable-companion' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
}

neoForge {
    version = '21.1.231'
    mods {
        powerdock { sourceSet sourceSets.main }
        powerdock_tests { sourceSet sourceSets.gameTest }
    }
    runs {
        gameTestServer {
            type = 'gameTestServer'
            loadedMods = [mods.powerdock, mods.powerdock_tests]
            gameDirectory = dockingTestRun
            programArguments.addAll('--world', 'fixture-world')
            if (lifecyclePhase != null) {
                systemProperty 'neoforge.enabledGameTestNamespaces', 'powerdock_lifecycle_tests'
                systemProperty 'powerdock.test.lifecyclePhase', lifecyclePhase
            } else if (loconauticsTestMods != null) {
                systemProperty 'neoforge.enabledGameTestNamespaces', 'powerdock_loconautics_tests'
            } else {
                systemProperty 'neoforge.enabledGameTestNamespaces',
                        withComputerCraft ? 'powerdock_cc_tests' : 'powerdock_tests'
            }
        }
    }
}

// A previous run's assembled bodies can survive in Sable's world save.
def resetDockingFixture = tasks.register('resetDockingFixture', Delete) {
    delete dockingTestRun.map { it.dir('fixture-world') }
}
if (lifecyclePhase == null) {
    tasks.named('runGameTestServer') { dependsOn resetDockingFixture }
}

dependencies {
    implementation('com.simibubi.create:create-1.21.1:6.0.10-280') { transitive = false }
    compileOnly 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
    compileOnly 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'
    implementation('curse.maven:power-grid-1321420:8880715') { transitive = false }
    compileOnly("dev.ryanhcode.sable:sable-neoforge-1.21.1:${minimumSableVersion}") { transitive = false }
    runtimeOnly("dev.ryanhcode.sable:sable-neoforge-1.21.1:${sableVersion}") { transitive = false }
    compileOnly('dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0') { transitive = false }
    runtimeOnly 'dev.architectury:architectury-neoforge:13.0.8'
    compileOnly("cc.tweaked:cc-tweaked-1.21.1-core-api:${computerCraftVersion}") { transitive = false }
    compileOnly("cc.tweaked:cc-tweaked-1.21.1-forge-api:${computerCraftVersion}") { transitive = false }
    if (withComputerCraft) {
        def computerCraft = "cc.tweaked:cc-tweaked-1.21.1-forge:${computerCraftVersion}"
        gameTestCompileOnly(computerCraft) { transitive = false }
        runtimeOnly(computerCraft) { transitive = false }
    }
    if (loconauticsTestMods != null) {
        def trainMods = fileTree(loconauticsTestMods) {
            include 'loconautics-*.jar', 'simulated-*.jar'
        }
        gameTestCompileOnly trainMods
        runtimeOnly trainMods
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources') {
    inputs.property 'version', project.version
    inputs.property 'minimumSableVersion', minimumSableVersion
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: project.version, minimumSableVersion: minimumSableVersion)
    }
}
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar') { from('LICENSE') }
