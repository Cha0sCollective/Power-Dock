plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.89'
}

group = 'org.cha0scollective.powerdock'
version = '0.2.0'
base { archivesName = 'power-dock' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
def minimumSableVersion = '2.0.5'
def sableVersion = providers.gradleProperty('sableVersion').orElse('2.0.6').get()
def dockingTestRun = layout.buildDirectory.dir("power-dock-test-${sableVersion}")

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://mvn.devos.one/snapshots' }
    maven { url = 'https://maven.architectury.dev' }
    exclusiveContent {
        forRepository { maven { url = 'https://maven.ryanhcode.dev/releases' } }
        filter { includeGroup 'dev.ryanhcode.sable'; includeGroup 'dev.ryanhcode.sable-companion' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
}

neoForge {
    version = '21.1.231'
    mods {
        powerdock { sourceSet sourceSets.main }
        powerdock_tests { sourceSet sourceSets.gameTest }
    }
    runs {
        gameTestServer {
            type = 'gameTestServer'
            loadedMods = [mods.powerdock, mods.powerdock_tests]
            gameDirectory = dockingTestRun
            programArguments.addAll('--world', 'fixture-world')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'powerdock_tests'
        }
    }
}

// A previous run's assembled bodies can survive in Sable's world save.
def resetDockingFixture = tasks.register('resetDockingFixture', Delete) {
    delete dockingTestRun.map { it.dir('fixture-world') }
}
tasks.named('runGameTestServer') { dependsOn resetDockingFixture }

dependencies {
    implementation('com.simibubi.create:create-1.21.1:6.0.10-280') { transitive = false }
    compileOnly 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
    compileOnly 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'
    implementation('curse.maven:power-grid-1321420:8880715') { transitive = false }
    compileOnly("dev.ryanhcode.sable:sable-neoforge-1.21.1:${minimumSableVersion}") { transitive = false }
    runtimeOnly("dev.ryanhcode.sable:sable-neoforge-1.21.1:${sableVersion}") { transitive = false }
    compileOnly('dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0') { transitive = false }
    runtimeOnly 'dev.architectury:architectury-neoforge:13.0.8'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources') {
    inputs.property 'version', project.version
    inputs.property 'minimumSableVersion', minimumSableVersion
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: project.version, minimumSableVersion: minimumSableVersion)
    }
}
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar') { from('LICENSE') }
